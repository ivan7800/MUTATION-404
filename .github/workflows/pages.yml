name: MUTATION 404 — Validate and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  issues: write
  id-token: write

concurrency:
  group: mutation-404-pages
  cancel-in-progress: false

jobs:
  validate:
    name: TypeScript, tests and web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Core tests
        id: core_tests
        run: npm run test:core > core-test-output.txt 2>&1 || { cat core-test-output.txt; exit 1; }
      - name: Report failing tests for diagnosis
        if: failure() && steps.core_tests.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo 'Temporary CI diagnostic, please close after fixing.'; echo; echo '```'; tail -n 100 core-test-output.txt; echo '```'; } > ci-diagnostic.md
          gh issue create --title 'CI diagnostic v1.7 — failing core tests' --body-file ci-diagnostic.md
      - name: Build static web release
        run: npm run build:offline
      - name: Verify Pages entry point
        run: |
          test -f play/index.html
          test -f play/style.css
          test -f play/js/apps/web/src/main.js
          grep -q './js/apps/web/src/main.js' play/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: play/

  deploy:
    name: Deploy game to GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
