name: MUTATION 404 — Validate and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mutation-404-pages
  cancel-in-progress: false

jobs:
  validate:
    name: TypeScript, tests and web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Core tests
        run: npm run test:core
      - name: Deterministic balance and resource telemetry
        run: node scripts/balance-audit.mjs
      - name: Build static web release
        run: npm run build:offline
      - name: Verify Pages entry point
        run: |
          test -f play/index.html
          test -f play/style.css
          grep -q 'assets/' play/index.html
          test -n "$(find play/assets -name '*.js' -print -quit)"
      - name: Install Chrome for visual QA
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Verify WebGL, controls, saves and Canvas fallback in Chromium
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/qa-browser.mjs
      - name: Upload combat balance telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-404-balance-audit
          path: qa-evidence/balance-report.json
          if-no-files-found: ignore
      - name: Store visual screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-404-browser-qa
          path: qa-evidence/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: play/

  deploy:
    name: Deploy game to GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
